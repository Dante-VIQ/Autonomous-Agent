[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vumbi-python-agent"
version = "1.0.0"
description = "Autonomous marketing agent for Vumbi Ventures"
authors = [
    {name = "Your Name", email = "your-email@example.com"}
]
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.8.0",
    "google-genai>=1.0.0",
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
vumbi-agent = "src.main:run_cycle"

[tool.setuptools.packages.find]
include = ["src*"]