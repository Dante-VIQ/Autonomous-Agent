[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vumbi-python-agent"
version = "1.0.0"
description = "Autonomous marketing agent for Vumbi Ventures"
authors = [
    {name = "Daniel Mwangi Maina", email = "bajohmaina@gmail.com"}
]
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.8.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
vumbi-agent = "src.main:run_cycle"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"